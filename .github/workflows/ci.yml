name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Test on ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    env:
      NUMBA_DISABLE_JIT: "1"

    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          uv pip install --system \
            pillow numpy scipy opencv-python-headless \
            pytest ruff


      - name: Install dependencies
        run: uv sync --dev

      - name: Check core imports
        run: |
          uv run python -c "from core.median_cut import build_palette, find_nearest_color_index; print('✅ median_cut')"
          uv run python -c "from core.lzw import compress; print('✅ lzw')"
          uv run python -c "from core.gif_encoder import encode_gif, GifFrame; print('✅ gif_encoder')"
          uv run python -c "from utils.metrics import compare_quality; print('✅ metrics')"

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Run ruff
        run: uv run ruff check .
        continue-on-error: true